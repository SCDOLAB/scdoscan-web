# Serve wallet-app/dist as https://<host>/wallet/app/
# Copy the files into /var/www/scdo/wallet/app/ (the dist contents, not the dist folder).
# Leave the legacy wallet at /wallet/ alone.
# /wallet/wallet-ui.json must be real JSON or a 404. Do not fall back to HTML.
# Send Strict-Transport-Security for the whole site if it is not already on.

location /wallet/app/assets/ {
    root /var/www/scdo;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://scdo.com.au https://apeccapital.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; trusted-types scdo; require-trusted-types-for 'script'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
}

location = /wallet/app/sw.js {
    root /var/www/scdo;
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Service-Worker-Allowed "/wallet/app/" always;
}

location /wallet/app/ {
    root /var/www/scdo;
    try_files $uri $uri/ /wallet/app/index.html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://scdo.com.au https://apeccapital.org; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; worker-src 'self'; trusted-types scdo; require-trusted-types-for 'script'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
}

location = /wallet/wallet-ui.json {
    root /var/www/scdo;
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}
