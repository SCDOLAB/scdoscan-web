name: Contract verification problem / 合约验证问题反馈
description: Report a problem with automatic contract verification on scdoscan.io (SCDO Mainnet, Shard 0, chainId 5680). Verification itself is done automatically at https://scdoscan.io/verify-contract.html.
title: "[Verify problem] 0x"
labels: ["contract-verification"]
body:
  - type: markdown
    attributes:
      value: |
        **Verification is automatic.** Use the form at https://scdoscan.io/verify-contract.html: paste the source and settings, sign with a KYC-verified address, and the result appears in seconds.
        Use this issue only if something does not work as expected (for example an error you do not understand, a contract type that is not supported, or a page that does not show your verified source).

        **验证为全自动。** 请在 https://scdoscan.io/verify-contract.html 提交：填写源码和编译参数，用已通过 KYC 的地址签名，几秒钟即可得到结果。
        仅在遇到问题时（例如看不懂的错误、不支持的合约类型、验证后页面未显示源码）才在这里反馈。

        ⚠️ This issue is public. Never paste private keys, seed phrases, passwords or KYC documents. / 本 issue 公开可见，切勿填写私钥、助记词、密码或 KYC 资料。
  - type: input
    id: address
    attributes:
      label: Contract address (Shard 0) / 合约地址
      placeholder: "0x…"
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Where did it go wrong? / 问题出现在哪一步？
      options:
        - Connecting a wallet or signing / 连接钱包或签名
        - KYC status / KYC 状态
        - Compile error / 编译错误
        - Bytecode mismatch that I believe is wrong / 我认为有误的字节码不匹配
        - Constructor arguments or creation check / 构造参数或部署交易核对
        - Verified, but the contract page does not show it / 已验证但合约页面未显示
        - Other / 其他
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Error code shown under the result (e.g. bytecode_mismatch) / 结果下方显示的错误代码
  - type: input
    id: compiler
    attributes:
      label: Compiler version, optimizer/runs, evmVersion / 编译器版本、优化器/runs、evmVersion
      placeholder: "v0.8.24+commit.e11b9ed9, optimizer on 200, paris"
  - type: textarea
    id: details
    attributes:
      label: What happened? / 具体情况
      description: Paste the full message from the result box. If needed, link to your source (for example a public repository). / 请粘贴结果框中的完整提示；如有需要，可附上源码链接（例如公开仓库）。
    validations:
      required: true
